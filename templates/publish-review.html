<!--
# 文件说明书 (File Manual)
## 核心功能 (Core Function)
提供视频预发布评审的单文件 HTML 模板，在视频上方展示 3:4、4:3、16:9 三个独立封面槽，以及公共标题、公共正文、平台标签与复制操作。
## 输入 (Input)
由 build_publish_review.py 注入视频 URL、内容数据、平台图标和独立存储键。
## 输出 (Output)
输出无需服务即可打开的交互式本地 HTML，支持三种封面比例分别确认、容量提示、标签选择、内部滚动和平台化复制。
## 定位 (Position)
位于 video-publish-workbench 的渲染层，只负责确定性展示与交互，不负责内容推理。
## 依赖 (Dependency)
- build_publish_review.py：校验并替换模板占位符。
- review-payload.schema.json：约束注入数据结构。
## 维护规则 (Maintenance Rules)
1. 每次修改代码逻辑后，必须检查并更新上述的【核心功能】、【输入】、【输出】等信息，确保文档与代码一致。
2. 禁止修改或删除本【维护规则】章节的内容。
3. 修改完成后，必须扫描当前文件所在的文件夹目录，找到对应的 [当前文件夹名称]_README.md 文档，并同步更新该 README 中关于本文件的描述信息。
-->

    .platform-tabs {

    .card {

    .card-head {

    .title-list { display: grid; gap: 10px; }

    .title-option:hover { transform: translateX(3px); border-color: var(--ink); }
    .title-option.selected { background: var(--acid); border-color: var(--ink); }

    .title-index {

    .title-count { font-size: 11px; color: var(--muted); white-space: nowrap; }

    .subsection-title {

    textarea {

    .tag-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 11px;
    }

    .legend-key { display: inline-flex; align-items: center; gap: 5px; }

    .legend-dot.preset { background: var(--amber); }
    .legend-dot.content { background: var(--blue); }
    .legend-dot.off { background: transparent; border-color: var(--disabled); }

    .tag-list { display: grid; gap: 9px; }

    .tag-option {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      background: transparent;
      padding: 12px 13px;
      text-align: left;
      cursor: pointer;

    .tag-option:hover:not(:disabled) { border-color: var(--ink); }
    .tag-option.selected { border-color: var(--ink); background: rgba(199,255,69,.25); }
    .tag-option.excluded { color: var(--disabled); }
    .tag-option.excluded .tag-name { text-decoration: line-through; text-decoration-thickness: 1px; }
    .tag-option:disabled { cursor: not-allowed; background: #ecebe5; }

    .tag-name { font-size: 14px; font-weight: 900; }
    .tag-reason { display: block; margin-top: 4px; font-size: 11px; line-height: 1.45; font-weight: 500; color: var(--muted); }
    .tag-option.excluded .tag-reason { color: var(--disabled); }

    .tag-meta { display: flex; align-items: center; gap: 6px; }

    .tag-badge {
      padding: 4px 6px;
      border: 1px solid var(--ink);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .06em;
      white-space: nowrap;

    .tag-badge.preset { background: var(--amber); }
    .tag-badge.content { background: var(--blue); }

    .source-link {

      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;

    .source-link:hover { color: var(--ink); }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 16px;
    }

    .btn {
      appearance: none;
      min-height: 44px;
      border: 1px solid var(--ink);
      background: var(--panel);
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 900;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }

    .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 3px 3px 0 var(--ink); }
    .btn.primary { background: var(--acid); }
    .btn.dark { background: var(--ink); color: var(--paper); }
    .btn:disabled { opacity: .38; cursor: not-allowed; }

    .confirm-bar {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 17px 18px;
      background: var(--ink);
      color: var(--paper);
    }

    .confirm-copy strong { display: block; font-size: 14px; }
    .confirm-copy span { display: block; margin-top: 3px; color: rgba(241,239,231,.58); font-size: 11px; }
    .confirm-bar .btn { flex: none; min-width: 132px; }

    .final-card { margin-top: 20px; }

    .final-card .card-body {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
    }

    .final-progress {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-track {
      flex: 1;
      height: 9px;
      border: 1px solid var(--ink);
      background: var(--paper);
    }

    .progress-fill { height: 100%; width: 0; background: var(--acid); transition: width .25s ease; }
    .progress-label { font-size: 12px; font-weight: 900; white-space: nowrap; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 100;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      background: var(--ink);
      color: var(--acid);
      border: 1px solid var(--acid);
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 900;
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 560px) {

      .title-count { grid-column: 2; }
      .confirm-bar { align-items: stretch; flex-direction: column; }
      .confirm-bar .btn { width: 100%; }
    }

    .five-title-grid .title-option{display:flex;flex-direction:column;flex:0 0 175px;align-items:stretch;justify-content:flex-start;gap:8px;min-height:72px;padding:9.6px 12px;border:1px solid #eee;border-radius:10px;background:#fff;scroll-snap-align:start}
    .five-title-grid .title-option.selected{border-color:#3A83F7;background:#fff}
    .title-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .title-choice{appearance:none;border:0;background:transparent;padding:0;font:inherit;font-size:10px;color:#777;cursor:pointer}
    .title-option.selected .title-choice{color:#3A83F7;font-weight:700}
    .title-card-head .capacity-pill{min-width:43.4px;height:16.8px;padding:0 5.6px;font-size:7px}
    .title-edit,.title-edit:hover,.title-edit:focus{display:block;width:100%;height:42px;min-height:42px;resize:none;overflow-y:auto;border:0;padding:0;outline:none;box-shadow:none;background:transparent;font-family:inherit;font-size:14px;line-height:1.5;font-weight:500;color:#333}

    /* 参考工作台：单行标题输入，聚焦仅显示下划线。 */
    .title-edit,.title-edit:hover{width:100%;min-width:0;height:auto;min-height:0;padding:3px 0;border:0;border-bottom:1px solid transparent;border-radius:0;background:transparent;color:#333;font-size:11.2px;font-weight:500;line-height:1.55;outline:none;box-shadow:none}
    .title-edit:focus,.title-edit:focus-visible{height:auto;min-height:0;padding:3px 0;border:0;border-bottom:1px solid #3A83F7;border-radius:0;outline:none;box-shadow:none;font-size:11.2px}

    .tag-platform-identity .capacity-pill{background:#f5f5f5;border:0;box-shadow:none;color:#333}
    .tag-platform-identity .capacity-pill.over{background:#fff0f0;color:#d93030;border:0}

    /* 标题卡片：方向编号与字数同排，单行标题在下方。 */
    .five-title-grid{gap:8px;padding-bottom:7px}
    .five-title-grid .title-option{flex:0 0 175px;min-height:72px;padding:9.6px 12px;gap:8px;border-radius:10px;cursor:pointer}
    .title-choice{font-size:10px;font-weight:500;color:#999;white-space:nowrap;text-align:left}
    .title-edit,.title-edit:hover,.title-edit:focus{font-size:11.2px;font-weight:500;color:#222;line-height:1.55}
    .title-card-head .capacity-pill{border:0;background:linear-gradient(to right,#cfe7ff 0 var(--capacity),#edf5fd var(--capacity) 100%);color:#333;font-weight:400}
    .title-card-head .capacity-pill.over{background:#ef4444;color:#fff}

    .content-review-panel{grid-template-rows:auto auto auto}
    .body-versions-card{min-width:0;background:transparent;border:0;box-shadow:none}
    .body-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
    #bodyCount{background:#f7f7f7;color:#999;font-size:11px;padding:5px 8px;border-radius:20px;white-space:nowrap}
    .body-options{display:flex;gap:6px;overflow-x:auto;min-width:0;max-width:100%;padding:0 0 8px;margin-bottom:4px}
    .body-options button{flex:none;white-space:nowrap;font:inherit;font-size:11px;line-height:1.55;padding:6px 11px;border:0;border-radius:24px;background:#f5f5f5;color:#333;cursor:pointer}
    .body-options button.active{background:#eef6ff;color:#3A83F7;font-weight:700}
    .body-options button:focus-visible{outline:2px solid #3A83F7;outline-offset:1px}
    .body-versions-card textarea.body-display{height:210px;max-height:none;background:#f7f7f7;border-radius:12px;padding:12px 14px}

    /* 收紧模块间距，保持表单及按钮自身尺寸。 */
    .review-layout{gap:12px}
    .content-review-panel{gap:6px;align-content:start}
    .compact-card-head{padding:8px 16px 6px}
    .compact-card-head h2{margin:0}
    .compact-card-body{padding:6px 16px 8px}
    .cover-picker{padding-top:8px;padding-bottom:6px}
    .video-card video{margin-top:8px}
    .tag-platform-group{padding-top:8px;padding-bottom:8px;row-gap:8px}
    @media(max-width:980px){.review-layout{row-gap:10px}}

    .media-preview{position:relative;width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:#f7f7f7;border-radius:12px;overflow:hidden}
    .media-preview>img,.video-card .media-preview>video{display:block;width:100%;height:100%;margin:0;object-fit:contain;border-radius:12px}
    .media-preview>[hidden]{display:none!important}
    #replacePreviewCover{position:absolute;right:10px;bottom:10px;padding:7px 12px;border:0;border-radius:20px;background:#fff;color:#333;font:inherit;font-size:11px;cursor:pointer;box-shadow:0 1px 6px #0001}
    .media-thumbs{display:flex;align-items:stretch;gap:8px;margin-top:10px;padding:2px 0 6px;overflow-x:auto}
    .media-thumbs .cover-slots{display:flex;gap:8px;flex:0 0 auto;width:auto;align-items:stretch}
    .media-thumbs .cover-slot,.video-thumb{width:70px;height:90px;aspect-ratio:auto!important;flex:0 0 70px;border:1px solid #dce8fa;border-radius:8px;background:#f7f9fc;overflow:hidden;cursor:pointer}
    .media-thumbs .cover-slot img{width:100%;height:100%;object-fit:contain}
    .media-thumbs .cover-slot.active,.video-thumb.active{border:2px solid #3A83F7}
    .media-thumbs .cover-slot-role{font-size:8px;padding:3px 4px}
    .media-thumbs .cover-slot-empty{font-size:9px;padding:5px}
    .video-thumb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#3A83F7;font:inherit;font-size:10px;padding:0}
    .video-thumb svg{width:24px;height:24px}
    .video-card{display:block}

    /* Cover labels, real video thumbnail, and reference interaction feedback. */
    .cover-type-badge{position:absolute;left:0;top:0;z-index:1;background:#3A83F7;color:#fff;font-size:10px;line-height:1.4;padding:3px 5px;border-radius:0 0 5px 0;pointer-events:none}
    .video-thumb{position:relative;background:#202020}
    .video-thumb img{width:100%;height:100%;object-fit:contain}
    .video-thumb svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;padding:5px;border-radius:50%;background:#0008;color:#fff}
    .toast,.toast.success{bottom:140px;background:#2f9d6a;color:#fff;border:0;padding:10px 18px;border-radius:10px;box-shadow:0 8px 30px #234e2430;font-size:13px;font-weight:400;transform:translate(-50%,15px);transition:.2s;max-width:calc(100vw - 32px);text-align:center}
    .toast.warning{background:#fff3c4;color:#735b22;box-shadow:0 8px 28px #735b2214}
    .toast.show{opacity:1;transform:translate(-50%,0)}
  
    /* Small screens share the preview's left and right content edges. */
    @media (max-width:980px){
      .content-review-panel .compact-card-head,
      .content-review-panel .compact-card-body,
      .content-review-panel .tag-platform-group{
        padding-left:0;
        padding-right:0;
      }
      .content-review-panel{min-width:0}
    }
  
    /* Ratio labels remain readable without competing with the blue cover badge. */
    .media-thumbs .cover-slot-role{background:rgba(55,60,67,.62);color:#fff}
  </style>
</head>
<body>
  <main class="shell">
    

    <section class="review-layout">
      <aside class="video-rail">
        <article class="video-card">
          <div class="media-preview" id="mediaPreview">
            <img id="previewCover" alt="封面预览" hidden>
            <video id="previewVideo" poster="__VIDEO_POSTER__" controls preload="metadata" src="__VIDEO_URL__"></video>
            <button type="button" id="replacePreviewCover" hidden>更换封面</button>
          </div>
          <div class="media-thumbs" aria-label="封面与视频预览">
            <div class="cover-slots" id="coverSlots"></div>
            <button type="button" class="video-thumb" id="videoThumb" aria-label="预览视频"><img src="__VIDEO_POSTER__" alt="视频画面"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
          </div>
          <input class="cover-file-input" id="verticalCoverInput" type="file" accept="image/png,image/jpeg,image/webp">
          <input class="cover-file-input" id="bilibiliCoverInput" type="file" accept="image/png,image/jpeg,image/webp">
          <input class="cover-file-input" id="horizontalCoverInput" type="file" accept="image/png,image/jpeg,image/webp">
        </article>
      </aside>

      <section class="content-review-panel">
        <article class="shared-content-card">
          <header class="compact-card-head">
            <div><h2>标题</h2></div>
          </header>
          <div class="compact-card-body shared-content-flow">
            <div class="five-title-grid" id="sharedTitleList" aria-label="标题候选"></div>

          </div>
        </article>

        <article class="body-versions-card">
          <header class="compact-card-head body-heading"><h2>正文</h2><span id="bodyCount" aria-live="polite"></span></header>
          <div class="compact-card-body">
            <div class="body-options" id="bodyOptions" role="tablist" aria-label="正文版本"></div>
            <textarea class="body-display" id="bodyDisplay" aria-label="发布正文" spellcheck="false"></textarea>
          </div>
        </article>

        <article class="platform-tags-card">
          <header class="compact-card-head">
            <div><h2>各平台标签</h2></div>
          </header>
          <div class="tag-platform-list" id="tagPlatformList"></div>
        </article>
      </section>
    </section>
  </main>

  <div class="publish-footer"><div class="copy-primary-row"><button class="copy-btn primary" id="copyAI"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none"><path d="M7 16H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h7a3 3 0 0 1 3 3v1"/><rect x="7" y="7" width="14" height="14" rx="4"/><path d="M11.5 15.8q2.5 2.4 5 0"/><circle cx="11.5" cy="12.3" r=".65" class="icon-eye"/><circle cx="16.5" cy="12.3" r=".65" class="icon-eye"/></svg><span>复制发布信息给 AI</span></button></div><div class="copy-group"><button class="copy-btn" id="copyTitle"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none"><path d="M7 16H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h7a3 3 0 0 1 3 3v1"/><rect x="7" y="7" width="14" height="14" rx="4"/><path d="M11.5 15.8q2.5 2.4 5 0"/><circle cx="11.5" cy="12.3" r=".65" class="icon-eye"/><circle cx="16.5" cy="12.3" r=".65" class="icon-eye"/></svg><span>复制标题</span></button><button class="copy-btn" id="copyBody"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none"><path d="M7 16H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h7a3 3 0 0 1 3 3v1"/><rect x="7" y="7" width="14" height="14" rx="4"/><path d="M11.5 15.8q2.5 2.4 5 0"/><circle cx="11.5" cy="12.3" r=".65" class="icon-eye"/><circle cx="16.5" cy="12.3" r=".65" class="icon-eye"/></svg><span>复制正文与话题</span></button></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = "__STORAGE_KEY__";
    const clone = (value) => JSON.parse(JSON.stringify(value));
    const platformIcons = __PLATFORM_ICONS_JSON__;
    const reviewInitialData = __REVIEW_DATA_JSON__;

    let state = normalizeState(loadState());
    let toastTimer;
    const temporaryCovers = {cover: null, bilibiliCover: null, horizontalCover: null};

    const sharedTitleList = document.getElementById("sharedTitleList");
    const bodyDisplay = document.getElementById("bodyDisplay");
    const tagPlatformList = document.getElementById("tagPlatformList");
    const coverSlots = document.getElementById("coverSlots");
    const coverInputs = {
      cover: document.getElementById("verticalCoverInput"),
      bilibiliCover: document.getElementById("bilibiliCoverInput"),
      horizontalCover: document.getElementById("horizontalCoverInput"),
    };
    const toast = document.getElementById("toast");

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : clone(reviewInitialData);
      } catch (_) {
        return clone(reviewInitialData);
      }
    }

    function normalizeState(value) {
      const next = value && typeof value === "object" ? value : clone(reviewInitialData);
      next.covers.selectedCoverIds.bilibiliCover ??= null;
      next.covers.selectedCoverIds.horizontalCover ??= null;
      if (!Array.isArray(next.bodyVariants) || !next.bodyVariants.length) {
        next.bodyVariants = [{label:"原始正文", text:typeof next.body === "string" ? next.body : reviewInitialData.body}];
        next.selectedBody = 0;
      }
      if (!Number.isInteger(next.selectedBody) || !next.bodyVariants[next.selectedBody]) next.selectedBody = 0;
      next.body = next.bodyVariants[next.selectedBody].text;
      return next;
    }

    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function selectedTitle() { return state.titles[state.selectedTitle]?.text || ""; }
    function selectedTags(platform) { return platform.tags.filter(tag => tag.selected).map(tag => tag.name); }
    function tagLine(platform) { return selectedTags(platform).map(tag => `#${tag}`).join(" "); }
    function bodyWithTags(platform) { return [state.body.trimEnd(), tagLine(platform)].filter(Boolean).join("\n\n"); }
    function combinedText(platform) { return [selectedTitle(), state.body.trimEnd(), tagLine(platform)].filter(Boolean).join("\n\n"); }
    function shipinhaoShortTitle(value) {
      return Array.from(String(value || ""))
        .filter(character => /[\p{L}\p{N}\s]/u.test(character))
        .join("")
        .replace(/\s+/g, " ")
        .trim();
    }
    function platformTitle(platformId) {
      return platformId === "shipinhao" ? shipinhaoShortTitle(selectedTitle()) : selectedTitle();
    }
    function stableSelectedCover(role) {
      const id = state.covers.selectedCoverIds[role];
      return state.covers.candidates.find(candidate => candidate.id === id && candidate.role === role) || null;
    }
    function selectedSlotCover(role) { return temporaryCovers[role] || stableSelectedCover(role); }
    function resolvedCover(role) {
      const selected = selectedSlotCover(role);
      if (selected) return selected;
      return role === "cover" ? state.covers.fallbackCover : null;
    }

    function clearTemporaryCover(role) {
      if (temporaryCovers[role]?.previewUrl) URL.revokeObjectURL(temporaryCovers[role].previewUrl);
      temporaryCovers[role] = null;
    }

    function coverRoleLabel(role) { return {cover: "3:4 竖版", bilibiliCover: "4:3 横版", horizontalCover: "16:9 横版"}[role] || "封面"; }

    async function sha256File(file) {
      if (!window.crypto?.subtle) return null;
      const digest = await window.crypto.subtle.digest("SHA-256", await file.arrayBuffer());
      return Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, "0")).join("");
    }

    let activePreview = "video";
    function updateMediaPreview() {
      const video = document.getElementById("previewVideo");
      const img = document.getElementById("previewCover");
      const replace = document.getElementById("replacePreviewCover");
      const cover = activePreview === "video" ? null : resolvedCover(activePreview);
      video.hidden = Boolean(cover);
      img.hidden = !cover;
      replace.hidden = activePreview === "video";
      if (cover) {
        if (!video.paused) video.pause();
        img.src = cover.previewUrl;
        img.alt = coverRoleLabel(activePreview) + "封面预览";
      } else img.removeAttribute("src");
      document.getElementById("videoThumb").classList.toggle("active", activePreview === "video");
      document.getElementById("videoThumb").setAttribute("aria-pressed", String(activePreview === "video"));
      coverSlots.querySelectorAll("[data-cover-slot]").forEach(slot => {
        const active = slot.dataset.coverSlot === activePreview;
        slot.classList.toggle("active", active);
        slot.setAttribute("aria-pressed", String(active));
      });
    }
    document.getElementById("videoThumb").addEventListener("click", () => { activePreview = "video"; updateMediaPreview(); });
    document.getElementById("replacePreviewCover").addEventListener("click", () => { if (coverInputs[activePreview]) coverInputs[activePreview].click(); });
    function renderCovers() {
      const roles = ["cover", "bilibiliCover", "horizontalCover"];
      coverSlots.innerHTML = roles.map(role => {
        const selected = selectedSlotCover(role);
        return `
          <div class="cover-slot" data-cover-slot="${role}">
            ${selected ? `<img src="${escapeAttribute(selected.previewUrl)}" alt="${coverRoleLabel(role)}封面">` : `<span class="cover-slot-empty">选择${coverRoleLabel(role)}封面</span>`}
            <span class="cover-type-badge">封面</span><span class="cover-slot-role">${coverRoleLabel(role)}</span>
            ${selected ? `<button class="cover-clear" type="button" data-clear-cover="${role}" aria-label="清空${coverRoleLabel(role)}封面"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2L8 8M8 2L2 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>` : ""}
          </div>
        `;
      }).join("");
      coverSlots.querySelectorAll("[data-cover-slot]").forEach(slot => {
        const role = slot.dataset.coverSlot;
        const selectPreview = () => {
          activePreview = role;
          updateMediaPreview();
          if (!selectedSlotCover(role)) coverInputs[role].click();
        };
        slot.addEventListener("click", selectPreview);
        slot.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectPreview();
          }
        });
        slot.tabIndex = 0;
        slot.setAttribute("role", "button");
        ["dragenter", "dragover"].forEach(eventName => slot.addEventListener(eventName, event => {
          event.preventDefault();
          slot.classList.add("dragover");
        }));
        ["dragleave", "drop"].forEach(eventName => slot.addEventListener(eventName, event => {
          event.preventDefault();
          slot.classList.remove("dragover");
        }));
        slot.addEventListener("drop", event => void handleCoverFile(event.dataTransfer?.files?.[0], role));
      });
      coverSlots.querySelectorAll("[data-clear-cover]").forEach(button => button.addEventListener("click", event => {
        event.stopPropagation();
        const role = button.dataset.clearCover;
        clearTemporaryCover(role);
        state.covers.selectedCoverIds[role] = null;
        saveState();
        renderCovers();
        showToast(role === "cover" ? "已清空竖版封面，发布时将使用 3:4 第一帧候选" : "已清空横版封面", "success");
      }));
      updateMediaPreview();
    }

    async function handleCoverFile(file, role) {
      if (!file) return;
      const matched = state.covers.candidates.find(candidate =>
        candidate.fileName.toLocaleLowerCase() === file.name.toLocaleLowerCase()
        && (!candidate.size || candidate.size === file.size)
      );
      if (matched) {
        if (matched.role !== role) {
          showToast(`该文件已登记为${coverRoleLabel(matched.role)}封面，请放入对应槽位`, "warning");
          return;
        }
        clearTemporaryCover(matched.role);
        state.covers.selectedCoverIds[matched.role] = matched.id;
        saveState();
        renderCovers();
        showToast(`已选择${coverRoleLabel(matched.role)}封面`, "success");
        return;
      }
      clearTemporaryCover(role);
      temporaryCovers[role] = {
        id: `temporary-${role}`,
        label: coverRoleLabel(role),
        fileName: file.name,
        size: file.size,
        lastModified: file.lastModified,
        sha256: await sha256File(file),
        path: null,
        role,
        source: "temporary",
        previewUrl: URL.createObjectURL(file),
        publishable: false,
      };
      renderCovers();
    }

    function capacityPill(current, limit) {
      const ratio = limit > 0 ? Math.min(100, Math.max(0, current / limit * 100)) : 0;
      const over = current > limit;
      return `<span class="capacity-pill${over ? " over" : ""}" style="--capacity:${ratio}%" aria-label="已使用 ${current}，上限 ${limit}">${current}/${limit}</span>`;
    }

    const titleDirections = state.titles.map((title, index) => title.label || `方案${index + 1}`);
    function renderTitles() {
      sharedTitleList.innerHTML = state.titles.map((item, index) => `
        <div class="title-option${state.selectedTitle === index ? " selected" : ""}" data-title-card="${index}">
          <div class="title-card-head">
            <button type="button" class="title-choice" data-shared-title="${index}" aria-pressed="${state.selectedTitle === index}">${String(index + 1).padStart(2, "0")} · ${escapeHtml(titleDirections[index] || "备选标题")}</button>
            <span data-title-count="${index}">${capacityPill(Array.from(item.text).length, 16)}</span>
          </div>
          <input type="text" class="title-edit" data-title-edit="${index}" aria-label="编辑标题${index + 1}" spellcheck="false" value="${escapeAttribute(item.text)}">
        </div>
      `).join("");
    }

    function renderTagCapsules(platformId, platform) {
      return platform.tags
        .map((tag, index) => ({ tag, index }))
        .sort((left, right) => {
          if (left.tag.selected !== right.tag.selected) return Number(right.tag.selected) - Number(left.tag.selected);
          return left.index - right.index;
        })
        .map(({ tag, index }) => {
        const stateClass = tag.selected ? "selected" : "excluded";
        const kindLabel = tag.kind === "preset" ? "预设" : "AI 生成";
        const sourceHint = tag.source ? ` 来源：${tag.source}` : "";
        return `
          <button class="tag-capsule ${tag.kind} ${stateClass}" type="button"
            data-platform="${platformId}" data-tag-index="${index}" aria-pressed="${Boolean(tag.selected)}"
            title="${escapeAttribute(`${kindLabel}｜${tag.reason}${sourceHint}`)}">
            <span class="tag-name">#${escapeHtml(tag.name)}</span>
          </button>
        `;
        }).join("");
    }

    function copyIconSvg() {
      return `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>`;
    }

    function renderTagPlatforms() {
      tagPlatformList.innerHTML = Object.entries(state.platforms).map(([id, platform]) => `
        <section class="tag-platform-group">
          <div class="tag-platform-identity">
            <img class="platform-logo" src="${platformIcons[id]}" alt="${escapeAttribute(platform.name)} Logo">
            <span><strong>${escapeHtml(platform.name)}</strong>${capacityPill(selectedTags(platform).length, platform.tagLimit)}</span>
          </div>
          <div class="tag-platform-capsules">${renderTagCapsules(id, platform)}</div>
        </section>
      `).join("");
    }

    function updateBodyCount() {
      document.getElementById("bodyCount").textContent = `${Array.from(state.body).length} 字`;
    }
    function renderBodyOptions() {
      const options = document.getElementById("bodyOptions");
      options.innerHTML = state.bodyVariants.map((variant, index) => `<button type="button" role="tab" aria-selected="${state.selectedBody === index}" class="${state.selectedBody === index ? "active" : ""}" data-body-version="${index}">版本${index + 1}：${escapeHtml(variant.label)}</button>`).join("");
      options.querySelectorAll("[data-body-version]").forEach(button => button.addEventListener("click", () => {
        state.bodyVariants[state.selectedBody].text = bodyDisplay.value;
        state.selectedBody = Number(button.dataset.bodyVersion);
        state.body = state.bodyVariants[state.selectedBody].text;
        bodyDisplay.value = state.body;
        try { saveState(); } catch (_) { showToast("暂未保存，请先复制正文再离开", "warning"); }
        renderBodyOptions();
        updateBodyCount();
      }));
    }
    function render() {
      renderCovers();
      renderTitles();
      bodyDisplay.value = state.body;
      renderBodyOptions();
      updateBodyCount();
      renderTagPlatforms();
      bindInteractions();
    }

    function bindInteractions() {
      sharedTitleList.querySelectorAll("[data-title-edit]").forEach(input => input.addEventListener("input", () => {
        const index = Number(input.dataset.titleEdit);
        state.titles[index].text = input.value;
        sharedTitleList.querySelector(`[data-title-count="${index}"]`).innerHTML = capacityPill(Array.from(input.value).length, 16);
        try { saveState(); } catch (_) { showToast("暂未保存，请先复制标题再离开", "warning"); }
      }));
      const selectTitleCard = index => {
        state.selectedTitle = index;
        sharedTitleList.querySelectorAll("[data-title-card]").forEach(card => card.classList.toggle("selected", Number(card.dataset.titleCard) === index));
        sharedTitleList.querySelectorAll("[data-shared-title]").forEach(button => button.setAttribute("aria-pressed", String(Number(button.dataset.sharedTitle) === index)));
        try { saveState(); } catch (_) { showToast("暂未保存，请先复制标题再离开", "warning"); }
      };
      sharedTitleList.querySelectorAll("[data-title-card]").forEach(card => card.addEventListener("click", () => selectTitleCard(Number(card.dataset.titleCard))));
      sharedTitleList.querySelectorAll("[data-title-edit]").forEach(input => input.addEventListener("focus", () => selectTitleCard(Number(input.dataset.titleEdit))));

      tagPlatformList.querySelectorAll("[data-tag-index]").forEach(button => button.addEventListener("click", () => {
        const platform = state.platforms[button.dataset.platform];
        const tag = platform.tags[Number(button.dataset.tagIndex)];
        if (!tag.selected && selectedTags(platform).length >= platform.tagLimit) {
          showToast(`${platform.name}最多选择 ${platform.tagLimit} 个标签`, "warning");
          return;
        }
        tag.selected = !tag.selected;
        saveState();
        render();
      }));


    }

    Object.entries(coverInputs).forEach(([role, input]) => input.addEventListener("change", async () => {
      await handleCoverFile(input.files?.[0], role);
      input.value = "";
    }));

    window.getPublishReviewSelection = () => {
      const verticalCover = resolvedCover("cover");
      const bilibiliCover = resolvedCover("bilibiliCover");
      const horizontalCover = resolvedCover("horizontalCover");
      const serializeCover = cover => cover ? {
        id: cover.id,
        fileName: cover.fileName || null,
        size: Number.isFinite(cover.size) ? cover.size : null,
        sha256: cover.sha256 || null,
        path: cover.path,
        role: cover.role,
        source: cover.source,
        publishable: cover.publishable === true,
      } : null;
      return {
        schema_version: "social-publish-package.selection.v3",
        title: selectedTitle(),
        body: state.body,
        platforms: Object.fromEntries(Object.entries(state.platforms).map(([id, platform]) => [id, {
          mode: platform.mode,
          title: platformTitle(id),
          tags: selectedTags(platform),
        }])),
        covers: {
          verticalCover: serializeCover(verticalCover),
          bilibiliCover: serializeCover(bilibiliCover),
          horizontalCover: serializeCover(horizontalCover),
          horizontalCoverEnabled: Boolean(horizontalCover),
          selectedCoverIds: {...state.covers.selectedCoverIds},
        },
      };
    };

    async function copyText(text, message) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (_) {
        const helper = document.createElement("textarea");
        helper.value = text;
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        document.execCommand("copy");
        helper.remove();
      }
      showToast(message, "success");
    }

    function showToast(message, tone = "success") {
      toast.textContent = message;
      toast.classList.remove("success", "warning");
      toast.classList.add(tone);
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2300);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"]/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[character]));
    }

    function escapeAttribute(value) { return escapeHtml(value).replace(/'/g, "&#39;"); }

    function handleBodyInput() {
      state.body = bodyDisplay.value;
      state.bodyVariants[state.selectedBody].text = state.body;
      updateBodyCount();
      try {
        saveState();
      } catch (_) {
        showToast("暂未保存，请先复制正文再离开", "warning");
      }
    }
    bodyDisplay.addEventListener("input", handleBodyInput);
    document.getElementById("copyTitle").onclick = () => copyText(selectedTitle(), "标题已复制");
    document.getElementById("copyBody").onclick = () => {
      const content = Object.entries(state.platforms).map(([id, platform]) =>
        `【${platform.name}】\n${platform.mode === "combined" ? combinedText(platform) : bodyWithTags(platform)}`
      ).join("\n\n────────\n\n");
      copyText(content, "各平台正文与话题已复制");
    };
    document.getElementById("copyAI").onclick = () => {
      const selection = window.getPublishReviewSelection();
      const video = document.querySelector("video");
      selection.video = {path: __VIDEO_PATH_JSON__, preview_url: video?.currentSrc || video?.src || null};
      copyText("视频发布信息\n\n" + JSON.stringify(selection, null, 2), "发布信息已复制，可粘贴给 AI");
    };
    render();
  </script>
</body>
</html>
